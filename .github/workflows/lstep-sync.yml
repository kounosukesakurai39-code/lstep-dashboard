name: lstep-sync

# 毎朝7時台(日本時間)に、Lステップ中間システムから受け取って、受け口を最新にする。
# 中間システムは、午前3時に差分を取り込み、終わらなければ5時・6時台に続きを取り込むので、その後に動かす。
# 「ちょうど毎時0分」は GitHub が混み合って大きく遅れる(3時間以上のことも)ので、17分にずらしてある。
# 手動で動かすときは、Actions の「Run workflow」。
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

concurrency:
  group: lstep-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 受け口に取り込む
        run: node scripts/lstep-sync.mjs
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_KEY: ${{ secrets.HUB_KEY }}
